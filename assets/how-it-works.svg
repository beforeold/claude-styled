<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="370" viewBox="0 0 1280 370" role="img" aria-labelledby="title desc">
  <title id="title">Claude Styled 的简化工作方式</title>
  <desc id="desc">四个步骤：打开启动器、准备样式、启动官方 Claude、显示 Styled 界面。</desc>
  <rect width="1280" height="370" rx="28" fill="#111110"/>
  <text x="54" y="61" fill="#f1f1ed" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="25" font-weight="700">它做的事情很简单</text>
  <text x="54" y="91" fill="#8d8d88" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15">不替换官方应用，只在启动时准备视觉样式</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">
    <g transform="translate(54 132)">
      <rect width="250" height="168" rx="20" fill="#1d1d1c" stroke="#353533"/>
      <circle cx="34" cy="34" r="17" fill="#b8643f"/>
      <path d="M29 27h10v14H29z M26 32h16" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      <text x="28" y="87" fill="#f0f0ec" font-size="18" font-weight="700">打开启动器</text>
      <text x="28" y="118" fill="#a2a29d" font-size="14">Claude Styled.app</text>
      <text x="28" y="142" fill="#747470" font-size="13">作为统一入口</text>
    </g>
    <path d="M319 216h36" stroke="#4b4b48" stroke-width="2"/><path d="M350 209l8 7-8 7" fill="none" stroke="#4b4b48" stroke-width="2"/>
    <g transform="translate(370 132)">
      <rect width="250" height="168" rx="20" fill="#1d1d1c" stroke="#353533"/>
      <circle cx="34" cy="34" r="17" fill="#2d2d2b"/>
      <path d="M27 28h14v12H27z M30 25h8" fill="none" stroke="#d7d7d2" stroke-width="2" stroke-linecap="round"/>
      <text x="28" y="87" fill="#f0f0ec" font-size="18" font-weight="700">准备视觉文件</text>
      <text x="28" y="118" fill="#a2a29d" font-size="14">排版、背景、轻量动效</text>
      <text x="28" y="142" fill="#747470" font-size="13">写入本地扩展目录</text>
    </g>
    <path d="M635 216h36" stroke="#4b4b48" stroke-width="2"/><path d="M666 209l8 7-8 7" fill="none" stroke="#4b4b48" stroke-width="2"/>
    <g transform="translate(686 132)">
      <rect width="250" height="168" rx="20" fill="#1d1d1c" stroke="#353533"/>
      <circle cx="34" cy="34" r="17" fill="#2d2d2b"/>
      <path d="M28 33h12 M34 27v12" stroke="#d7d7d2" stroke-width="2" stroke-linecap="round"/>
      <text x="28" y="87" fill="#f0f0ec" font-size="18" font-weight="700">启动官方 Claude</text>
      <text x="28" y="118" fill="#a2a29d" font-size="14">应用本身保持不变</text>
      <text x="28" y="142" fill="#747470" font-size="13">样式随启动加载</text>
    </g>
    <path d="M951 216h36" stroke="#4b4b48" stroke-width="2"/><path d="M982 209l8 7-8 7" fill="none" stroke="#4b4b48" stroke-width="2"/>
    <g transform="translate(1002 132)">
      <rect width="224" height="168" rx="20" fill="#050505" stroke="#b8643f"/>
      <circle cx="34" cy="34" r="17" fill="#b8643f"/>
      <path d="M27 35l5 5 10-13" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="87" fill="#fff" font-size="18" font-weight="700">显示 Styled 界面</text>
      <text x="28" y="118" fill="#bdbdb8" font-size="14">重启后仍可恢复</text>
      <text x="28" y="142" fill="#777" font-size="13">从启动器进入即可</text>
    </g>
  </g>
</svg>
